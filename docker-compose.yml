services:
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: shortener, POSTGRES_USER: shortener, POSTGRES_PASSWORD: shortener}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U shortener"], interval: 5s, timeout: 3s, retries: 10}
    volumes: [shortener-data:/var/lib/postgresql/data]
  app:
    build: .
    ports: ["8080:8080"]
    environment: {DB_URL: "jdbc:postgresql://db:5432/shortener", DB_USER: shortener, DB_PASSWORD: shortener, BASE_URL: "http://localhost:8080"}
    depends_on: {db: {condition: service_healthy}}
volumes: {shortener-data: {}}
