spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${DB_USER:shortener}
    password: ${DB_PASSWORD:shortener}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway.enabled: true
server:
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true
app.base-url: ${BASE_URL:http://localhost:8080}
